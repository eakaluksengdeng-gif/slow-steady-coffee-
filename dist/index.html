<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3ead5">
  <title>Slow &amp; Steady Coffee</title>
  <meta name="description" content="แอปจัดเก็บสูตรกาแฟ โหมดชง และคำนวณต้นทุนสำหรับร้าน Slow Bar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="neo.css?v=mobile-editor-2">
  <link rel="stylesheet" href="cloud.css">
</head>
<body>
  <div class="paper-noise" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">YOUR DAILY COFFEE CLUB</p><h1>Slow &amp; Steady<span class="brand-note">สูตรของเรา ชงให้เป๊ะทุกแก้ว ✦</span></h1></div>
      <button class="round-button" id="addRecipeTop" aria-label="เพิ่มสูตร">＋</button>
    </header>

    <main>
      <section class="page active" id="recipesPage" aria-labelledby="recipesTitle">
        <div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="ค้นหาเมนูหรือวัตถุดิบ" aria-label="ค้นหาสูตร"></div>
        <div class="chips" id="categoryChips" aria-label="กรองประเภทสูตร"></div>
        <article class="signature" id="featuredRecipe"></article>
        <div class="section-head"><h2 id="recipesTitle">สูตรของฉัน</h2><span id="recipeCount"></span></div>
        <div class="recipe-list" id="recipeList"></div>
      </section>

      <section class="page" id="costPage" aria-labelledby="costTitle">
        <p class="eyebrow">COST OVERVIEW</p><h2 id="costTitle" class="page-title">ต้นทุนต่อแก้ว</h2>
        <div class="cost-summary"><span>กำไรโดยประมาณจากทุกสูตร</span><strong id="avgMargin">0%</strong></div>
        <div id="costList" class="cost-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="เมนูหลัก">
      <button class="nav-item active" data-page="recipesPage"><span>⌂</span><small>สูตร</small></button>
      <button class="nav-item" data-action="quick-brew"><span>◷</span><small>ชงล่าสุด</small></button>
      <button class="nav-item" data-page="costPage"><span>฿</span><small>ต้นทุน</small></button>
    </nav>
  </div>

  <dialog id="recipeDialog" class="sheet">
    <form method="dialog" id="recipeForm">
      <header class="sheet-head"><button type="button" class="text-button" data-close>ยกเลิก</button><h2 id="formTitle">เพิ่มสูตรใหม่</h2><button class="text-button accent" value="save">บันทึก</button></header>
      <div class="sheet-body">
        <input type="hidden" id="recipeId">
        <label>ชื่อเมนู<input required id="name" placeholder="เช่น Iced Latte"></label>
        <div class="form-grid"><label>ประเภท<select id="category"><option>Espresso</option><option>นม</option><option>Slow Bar</option><option>Signature</option></select></label><label>เสิร์ฟ<select id="serve"><option>ร้อน</option><option>เย็น</option></select></label></div>
        <div class="form-grid"><label>ขนาดแก้ว<input id="size" placeholder="เช่น 16 oz"></label><label>ราคาขาย (บาท)<input id="price" type="number" min="0" step="0.01"></label></div>
        <h3>Espresso</h3>
        <div class="form-grid three"><label>กาแฟ (g)<input id="dose" type="number" min="0" step="0.1"></label><label>ช็อต (g)<input id="yield" type="number" min="0" step="0.1"></label><label>เวลา (วินาที)<input id="shotTime" type="number" min="0"></label></div>
        <h3>วัตถุดิบ</h3>
        <div id="ingredientRows"></div><button type="button" class="outline-button" id="addIngredient">＋ เพิ่มวัตถุดิบ</button>
        <h3>ขั้นตอนการทำ</h3>
        <div id="stepRows"></div><button type="button" class="outline-button" id="addStep">＋ เพิ่มขั้นตอน</button>
        <h3>ต้นทุน</h3>
        <div class="form-grid"><label>ต้นทุนต่อแก้ว (บาท)<input id="cost" type="number" min="0" step="0.01"></label><label>หมายเหตุ<textarea id="notes" rows="3" placeholder="รสชาติ เบอร์บด หรือข้อควรจำ"></textarea></label></div>
        <button type="button" class="delete-button" id="deleteRecipe" hidden>ลบสูตรนี้</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="sheet detail-sheet"><div id="detailContent"></div></dialog>
  <dialog id="brewDialog" class="brew-dialog"><div id="brewContent"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="enhancements.js"></script>
  <script src="cloud-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="shared-recipes.js"></script>
  <script src="shared-cloud.js"></script>
</body>
</html>
